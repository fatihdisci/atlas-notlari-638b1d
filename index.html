  <script>'use strict';

const unavailable = 'Sayfa kullanılamıyor.';

function loadScript(source) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = source;
    script.referrerPolicy = 'no-referrer';
    script.onload = resolve;
    script.onerror = reject;
    document.head.append(script);
  });
}

function decodeBase64Url(text) {
  const base64 = text.replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(base64), char => char.charCodeAt(0));
}

function getStorageKey(cloudStorage) {
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error(unavailable)), 8000);
    try {
      cloudStorage.getItem('panel_v1', (error, value) => {
        clearTimeout(timeout);
        if (error || typeof value !== 'string' || !/^[A-Za-z0-9_-]{43}$/.test(value)) {
          reject(new Error(unavailable));
        } else {
          resolve(decodeBase64Url(value));
        }
      });
    } catch (error) {
      clearTimeout(timeout);
      reject(error);
    }
  });
}

async function unlock(storage) {
  const payload = decodeBase64Url(document.getElementById('data').textContent);
  const keyBytes = await getStorageKey(storage);
  const subtle = crypto.subtle;
  try {
    const key = await subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    const plaintext = await subtle.decrypt({ name: 'AES-GCM', iv: payload.subarray(0, 12) },
      key, payload.subarray(12));
    return new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
  } finally {
    keyBytes.fill(0);
  }
}

async function show(plaintext) {
  const panel = new DOMParser().parseFromString(plaintext, 'text/html');
  const scripts = Array.from(panel.body.querySelectorAll('script'));
  if (!scripts.length || scripts.some(script => script.hasAttribute('src'))) throw new Error(unavailable);
  for (const script of scripts) script.remove();

  document.title = panel.title;
  document.head.querySelector('link[rel="icon"]').href = panel.head.querySelector('link[rel="icon"]').href;
  for (const node of panel.head.querySelectorAll('style, meta[name="theme-color"]')) {
    document.head.append(node);
  }
  document.body.replaceChildren(...panel.body.childNodes);
  // Execute the authenticated code in order, in the window holding Telegram's bridge.
  for (const original of scripts) {
    const url = URL.createObjectURL(new Blob([original.textContent], { type: 'text/javascript' }));
    try {
      await loadScript(url);
    } finally {
      URL.revokeObjectURL(url);
    }
  }
}

(async () => {
  if (!location.hash.includes('tgWebAppData=') && !window.TelegramWebviewProxy &&
      typeof window.external?.notify !== 'function' && window.parent === window) return;

  // The official bridge logs custom-method response objects, including CloudStorage values.
  const log = console.log.bind(console);
  console.log = (...args) => {
    if (args[0] !== '[Telegram.WebView] < receiveEvent' || args[1] !== 'custom_method_invoked') log(...args);
  };
  const status = document.getElementById('status');
  let webApp;
  try {
    await loadScript('https://telegram.org/js/telegram-web-app.js');
    webApp = window.Telegram?.WebApp;
    if (!webApp?.initData || !webApp.isVersionAtLeast('6.9') ||
        !webApp.CloudStorage || !window.crypto?.subtle) {
      webApp?.ready();
      return;
    }
    status.textContent = 'Açılıyor…';
    await show(await unlock(webApp.CloudStorage));
  } catch {
    status.textContent = unavailable;
    if (!status.isConnected) document.body.replaceChildren(status);
    webApp?.ready();
  }
})();
</script>
